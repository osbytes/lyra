# CI: typecheck, lint, check docs/CONFIG.md, run the unit tests and bundle the app (`pnpm check`
# on Linux, Windows and macOS); run the native and UI smoke tests on Windows and macOS; check and
# build the website; and refuse a PR without a changeset (.changeset/README.md). Runs on PRs and on
# every push to main, so main's own state is always known. Installers are packaged only by
# release.yml, from a version tag; a manual run of release.yml builds them without publishing.
#
# The job names (`changeset`, `website`, `build`, `smoke (Windows)`, `smoke (macOS)`) are the
# required status checks in the main branch ruleset (docs/RELEASING.md); rename them together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push to a PR replaces its run; every commit on main keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The PR adds a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # the Release PR consumes changesets; it never adds one
          case "$HEAD_REF" in changeset-release/*) echo "release PR"; exit 0 ;; esac
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- .changeset)
          if printf '%s\n' "$added" | grep -E '^\.changeset/.+\.md$' | grep -vqx '.changeset/README.md'; then
            echo "changeset found"; exit 0
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "::error::no changeset yet; dependabot-changeset.yml adds one, re-run once it has"
          else
            echo "::error::this PR has no changeset. Run 'pnpm changeset' (or 'pnpm changeset --empty' for docs-only or internal changes). See docs/RELEASING.md."
          fi
          exit 1

  web:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # only the site's dependencies: skips Electron's binary and the native whisper build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter web...
      - name: Typecheck and lint
        run: pnpm --filter web check
      - name: Build
        run: pnpm --filter web build

  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # postinstall patches the whisper addon's rpath with patchelf
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # typecheck, lint, config docs, unit tests and bundle; installers are only packaged by release.yml
      - name: Typecheck, lint, test and bundle
        run: pnpm --filter lyra run build

  # The checks and smoke tests on Windows, where Lyra is mostly developed: `pnpm check` (path,
  # line-ending and platform differences show up here first), then the UI smoke test, which
  # launches the built app with `electron . smoke`, runs the main-process checks and drives the
  # IPC bridge from the renderer. Also loads the native Whisper addon. No models are downloaded.
  smoke:
    name: smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, config docs and unit tests
        run: pnpm --filter lyra run check
      - name: Native addon smoke
        run: pnpm --filter lyra run smoke
      - name: UI smoke
        run: pnpm --filter lyra run smoke:ui

  # The same on macOS (Apple silicon), which otherwise was first built by release.yml on a tag.
  # Also compiles the Swift mic-watch helper the Mac app ships (native/mac).
  smoke-mac:
    name: smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, config docs and unit tests
        run: pnpm --filter lyra run check
      - name: Build the Mac helpers
        run: pnpm --filter lyra run build:mac-helpers
      - name: Native addon smoke
        run: pnpm --filter lyra run smoke
      - name: UI smoke
        run: pnpm --filter lyra run smoke:ui
