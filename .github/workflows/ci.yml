# CI: typecheck, lint, check docs/CONFIG.md and bundle the app; run the UI smoke test on Windows;
# check and build the website; and refuse a PR without a changeset (.changeset/README.md). Runs on
# PRs only. Installers are packaged only by release.yml, from a version tag; a manual run of
# release.yml builds them without publishing.
name: ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The PR adds a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # the Release PR consumes changesets; it never adds one
          case "$HEAD_REF" in changeset-release/*) echo "release PR"; exit 0 ;; esac
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- .changeset)
          if printf '%s\n' "$added" | grep -E '^\.changeset/.+\.md$' | grep -vqx '.changeset/README.md'; then
            echo "changeset found"; exit 0
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "::error::no changeset yet; dependabot-changeset.yml adds one, re-run once it has"
          else
            echo "::error::this PR has no changeset. Run 'pnpm changeset' (or 'pnpm changeset --empty' for docs-only or internal changes). See docs/RELEASING.md."
          fi
          exit 1

  web:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # only the site's dependencies: skips Electron's binary and the native whisper build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter web...
      - name: Typecheck and lint
        run: pnpm --filter web check
      - name: Build
        run: pnpm --filter web build

  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # postinstall patches the whisper addon's rpath with patchelf
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # typecheck, lint and bundle; installers are only packaged by release.yml
      - name: Typecheck, lint and bundle
        run: pnpm --filter lyra run build

  # The UI smoke test on Windows, where Lyra is mostly developed: launches the built app with
  # `electron . smoke`, runs the main-process checks and drives the IPC bridge from the renderer.
  # Also loads the native Whisper addon. No models are downloaded.
  smoke:
    name: smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Native addon smoke
        run: pnpm --filter lyra run smoke
      - name: UI smoke
        run: pnpm --filter lyra run smoke:ui
