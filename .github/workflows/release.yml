# Release: on a version tag (v1.2.3), build the installers on macOS, Windows and Linux, attest
# them, and publish the GitHub release. The body is this version's CHANGELOG.md section. The
# latest*.yml files and blockmaps are what electron-updater reads from releases/latest.
#
# A manual run builds and attests the chosen branch without publishing, or, given a tag whose
# release failed, builds that tag's source with this workflow and publishes it (docs/RELEASING.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag (vX.Y.Z) with no release: build it and publish it. Empty: build this branch only."
        type: string
        default: ""

# a tag push and a manual run for the same tag never publish at once
concurrency:
  group: ${{ github.workflow }}-${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

# read-only by default; the publish job takes exactly the write scopes it needs
permissions:
  contents: read

# Windows runners default to PowerShell, where "$SCRIPT" is an empty PowerShell variable rather than
# the env var. `pnpm run ""` only lists the scripts and exits 0, which is how v0.2.0 and v0.3.0
# built nothing and never published. Every step runs in bash, on every OS.
defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      app: ${{ steps.v.outputs.app }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      # a manual run given a tag reads that tag's source; anything else, the commit that triggered it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - name: Version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a manual run without a tag only builds
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag=$GITHUB_REF_NAME; else tag=$INPUT_TAG; fi
          # tag names may only be versions: nothing else ever reaches a shell
          if [ -n "$tag" ]; then
            case "$tag" in *[!A-Za-z0-9.+-]*) echo "not a version tag: $tag"; exit 1 ;; esac
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $tag"; exit 1 ;; esac
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag already has a release"; exit 1
            fi
          fi

          # tags from before the Turborepo move (v0.2.0 and older) keep the app at the root
          if [ -f apps/lyra/package.json ]; then app=apps/lyra; else app=.; fi
          pkg=$(node -p "require('./$app/package.json').version" | tr -cd 'A-Za-z0-9.+-')
          if [ -n "$tag" ] && [ "v$pkg" != "$tag" ]; then
            echo "tag $tag does not match $app/package.json $pkg"; exit 1
          fi
          # the release body; checked on every run so a missing CHANGELOG section fails before the builds
          node scripts/release-notes.mjs "$pkg" > /dev/null

          latest=false
          if [ -n "$tag" ]; then
            # releases/latest is what every install updates to: only the newest stable version
            # takes it, so an older tag published late never replaces a newer release there
            newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
            if [ "$tag" = "$newest" ]; then latest=true; fi
          fi

          {
            echo "version=$pkg"
            echo "tag=$tag"
            echo "ref=${tag:+refs/tags/$tag}"
            echo "app=$app"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing leaves the others running, so a broken build shows every failure at once
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: build:mac
          - name: Windows
            os: windows-latest
            script: build:win
          - name: Linux
            os: ubuntu-22.04
            script: build:linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # no dependency cache for builds that get published: a cache written by another
          # workflow run could otherwise reach the installers (zizmor: cache-poisoning)
          package-manager-cache: false
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and package
        working-directory: ${{ needs.version.outputs.app }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: pnpm run "$SCRIPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-dist
          if-no-files-found: error
          path: |
            ${{ needs.version.outputs.app }}/dist/*.dmg
            ${{ needs.version.outputs.app }}/dist/*.zip
            ${{ needs.version.outputs.app }}/dist/*-setup.exe
            ${{ needs.version.outputs.app }}/dist/*.AppImage
            ${{ needs.version.outputs.app }}/dist/*.deb
            ${{ needs.version.outputs.app }}/dist/latest*.yml
            ${{ needs.version.outputs.app }}/dist/*.blockmap

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write  # store it on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: ls -la out

      # `gh attestation verify lyra-<v>-setup.exe --owner osbytes` proves an installer came from
      # this workflow in this repository
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.dmg
            out/*.zip
            out/*-setup.exe
            out/*.AppImage
            out/*.deb

      # SBOM of every dependency in pnpm-lock.yaml (SPDX JSON); it lands in out/, so the release
      # step below attaches it with the installers
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: out/lyra-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # the release body is this version's CHANGELOG.md section (what changesets wrote), not the tag message
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md && cat release-notes.md

      # only version tags publish (a tag push, or a manual run given a tag); a manual run without
      # one stops after building and attesting. The release starts as a draft and is published once
      # every file is uploaded: a published release is releases/latest at once, and the website or
      # an install reading it mid-upload would find it without its installers.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: needs.version.outputs.tag != ''
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: out/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
      - name: Publish the release
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"

      # the website caches releases/latest for an hour, across deployments; this makes its download
      # links switch now. A failure only delays them, so it warns instead of failing the release.
      - name: Refresh the website's download links
        if: needs.version.outputs.tag != ''
        env:
          SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::SITE_REVALIDATE_SECRET is not set; the website picks up this release within the hour"
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" https://lyra.osbytes.io/api/revalidate \
            || echo "::warning::the website didn't refresh; it picks up this release within the hour"
