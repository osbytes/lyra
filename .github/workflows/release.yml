# Release: on a version tag (v1.2.3), build the installers on macOS, Windows and Linux, attest
# them, and publish the GitHub release. The body is this version's CHANGELOG.md section. The
# latest*.yml files and blockmaps are what electron-updater reads from releases/latest.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# read-only by default; the publish job takes exactly the write scopes it needs
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: v
        run: |
          # tag names may only be versions: nothing else ever reaches a shell
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "not a version tag: $GITHUB_REF_NAME"; exit 1; } ;; esac
          pkg=$(node -p "require('./apps/lyra/package.json').version")
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match apps/lyra/package.json $pkg"; exit 1
          fi
          echo "version=$(printf %s "$pkg" | tr -cd 'A-Za-z0-9.+-')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: build:mac
          - name: Windows
            os: windows-latest
            script: build:win
          - name: Linux
            os: ubuntu-22.04
            script: build:linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and package
        env:
          SCRIPT: ${{ matrix.script }}
        run: pnpm --filter lyra run "$SCRIPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-dist
          if-no-files-found: error
          path: |
            apps/lyra/dist/*.dmg
            apps/lyra/dist/*.zip
            apps/lyra/dist/*-setup.exe
            apps/lyra/dist/*.AppImage
            apps/lyra/dist/*.deb
            apps/lyra/dist/latest*.yml
            apps/lyra/dist/*.blockmap

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write  # store it on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: ls -la out

      # `gh attestation verify lyra-<v>-setup.exe --owner osbytes` proves an installer came from
      # this workflow in this repository
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.dmg
            out/*.zip
            out/*-setup.exe
            out/*.AppImage
            out/*.deb

      # SBOM of every dependency in pnpm-lock.yaml (SPDX JSON); it lands in out/, so the release
      # step below attaches it with the installers
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: out/lyra-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # the release body is this version's CHANGELOG.md section (what changesets wrote), not the tag message
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md && cat release-notes.md

      # only version tags publish; a manual run stops after building and attesting
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: release-notes.md
          files: out/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
