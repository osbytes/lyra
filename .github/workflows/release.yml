# Release: on a version tag (v1.2.3), build the installers on macOS (Apple silicon and Intel),
# Windows and Linux, launch each packaged app's own smoke test, attest them, and publish the GitHub
# release. The body is this version's CHANGELOG.md section. The
# latest*.yml files and blockmaps are what electron-updater reads from releases/latest.
#
# A manual run builds and attests the chosen branch without publishing, or, given a tag whose
# release failed, builds that tag's source with this workflow and publishes it (docs/RELEASING.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag (vX.Y.Z) with no release: build it and publish it. Empty: build this branch only."
        type: string
        default: ""

# a tag push and a manual run for the same tag never publish at once
concurrency:
  group: ${{ github.workflow }}-${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

# read-only by default; the publish job takes exactly the write scopes it needs
permissions:
  contents: read

# Windows runners default to PowerShell, where "$SCRIPT" is an empty PowerShell variable rather than
# the env var. `pnpm run ""` only lists the scripts and exits 0, which is how v0.2.0 and v0.3.0
# built nothing and never published. Every step runs in bash, on every OS.
defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      app: ${{ steps.v.outputs.app }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      # a manual run given a tag reads that tag's source; anything else, the commit that triggered it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - name: Version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a manual run without a tag only builds
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag=$GITHUB_REF_NAME; else tag=$INPUT_TAG; fi
          # tag names may only be versions: nothing else ever reaches a shell
          if [ -n "$tag" ]; then
            case "$tag" in *[!A-Za-z0-9.+-]*) echo "not a version tag: $tag"; exit 1 ;; esac
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $tag"; exit 1 ;; esac
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag already has a release"; exit 1
            fi
          fi

          # tags from before the Turborepo move (v0.2.0 and older) keep the app at the root
          if [ -f apps/lyra/package.json ]; then app=apps/lyra; else app=.; fi
          pkg=$(node -p "require('./$app/package.json').version" | tr -cd 'A-Za-z0-9.+-')
          if [ -n "$tag" ] && [ "v$pkg" != "$tag" ]; then
            echo "tag $tag does not match $app/package.json $pkg"; exit 1
          fi
          # the release body; checked on every run so a missing CHANGELOG section fails before the builds
          node scripts/release-notes.mjs "$pkg" > /dev/null

          latest=false
          if [ -n "$tag" ]; then
            # releases/latest is what every install updates to: only the newest stable version
            # takes it, so an older tag published late never replaces a newer release there
            newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
            if [ "$tag" = "$newest" ]; then latest=true; fi
          fi

          {
            echo "version=$pkg"
            echo "tag=$tag"
            echo "ref=${tag:+refs/tags/$tag}"
            echo "app=$app"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing leaves the others running, so a broken build shows every failure at once
      fail-fast: false
      # Each Mac is built on its own architecture: native addons (whisper, sherpa-onnx, libsql,
      # node-llama-cpp) come as per-platform packages that only install for the machine's own CPU.
      # The dmg name carries the arch so the two don't collide; it is set here rather than only in
      # electron-builder.yml so an older tag (built by a manual run) gets it too. pnpm quotes the
      # extra arguments, so electron-builder sees ${arch} literally.
      # `packaged` and `resources` are the unpacked app electron-builder leaves next to the installers.
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            script: build:mac
            builder-args: --arm64 -c.dmg.artifactName=${name}-${version}-${arch}.${ext}
            packaged: dist/mac-arm64/Lyra.app/Contents/MacOS/Lyra
            resources: dist/mac-arm64/Lyra.app/Contents/Resources
          - name: macOS-x64
            os: macos-15-intel
            script: build:mac
            builder-args: --x64 -c.dmg.artifactName=${name}-${version}-${arch}.${ext}
            packaged: dist/mac/Lyra.app/Contents/MacOS/Lyra
            resources: dist/mac/Lyra.app/Contents/Resources
          - name: Windows
            os: windows-latest
            script: build:win
            builder-args: ""
            packaged: dist/win-unpacked/Lyra.exe
            resources: dist/win-unpacked/resources
          - name: Linux
            os: ubuntu-22.04
            script: build:linux
            builder-args: ""
            packaged: dist/linux-unpacked/lyra
            resources: dist/linux-unpacked/resources
    steps:
      # The Windows image checks text files out as CRLF (core.autocrlf true). Tags from before
      # .gitattributes pinned LF (v0.4.0 and older) would build from CRLF files, which broke
      # config-docs.mjs and the v0.4.0 release; LF matches what every other OS builds from.
      - name: Check files out with LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # no dependency cache for builds that get published: a cache written by another
          # workflow run could otherwise reach the installers (zizmor: cache-poisoning)
          package-manager-cache: false
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and package
        working-directory: ${{ needs.version.outputs.app }}
        env:
          SCRIPT: ${{ matrix.script }}
          BUILDER_ARGS: ${{ matrix.builder-args }}
        run: |
          # shellcheck disable=SC2086 # split on purpose: each word is one electron-builder option
          pnpm run "$SCRIPT" $BUILDER_ARGS
      # The installers are made from this unpacked app, so its smoke task (`<app> smoke`, the same
      # checks `pnpm smoke:ui` runs in development) catches a broken asar, a native addon or extra
      # resource that didn't make it in, before anything is published. No models are downloaded.
      - name: Smoke-test the packaged app
        working-directory: ${{ needs.version.outputs.app }}
        timeout-minutes: 10
        env:
          APP: ${{ matrix.packaged }}
          RESOURCES: ${{ matrix.resources }}
          # the same fake key run-ui-smoke.cjs sets: the smoke test proves it is never logged
          ANTHROPIC_API_KEY: sk-ant-smoke-not-a-real-key
          # packaged builds only run a task from the command line when this is set
          LYRA_ALLOW_TASKS: "1"
        run: |
          if [ ! -d "$RESOURCES/llama/node_modules/node-llama-cpp" ]; then
            echo "::error::node-llama-cpp is missing from $RESOURCES/llama (scripts/prepare-llama.cjs)"
            exit 1
          fi
          if [ "$RUNNER_OS" = macOS ] && [ ! -x "$RESOURCES/micwatch" ]; then
            echo "::error::the micwatch helper is missing from $RESOURCES (scripts/build-mac-helpers.cjs)"
            exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$APP" smoke; else "$APP" smoke; fi
      # Both Mac builds write latest-mac.yml; the Intel one is renamed so the publish job can merge
      # it into the Apple silicon one instead of one overwriting the other.
      - name: Keep the Intel Mac update file apart
        if: matrix.name == 'macOS-x64'
        working-directory: ${{ needs.version.outputs.app }}
        run: mv dist/latest-mac.yml dist/latest-mac-x64.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-dist
          if-no-files-found: error
          path: |
            ${{ needs.version.outputs.app }}/dist/*.dmg
            ${{ needs.version.outputs.app }}/dist/*.zip
            ${{ needs.version.outputs.app }}/dist/*-setup.exe
            ${{ needs.version.outputs.app }}/dist/*.AppImage
            ${{ needs.version.outputs.app }}/dist/*.deb
            ${{ needs.version.outputs.app }}/dist/latest*.yml
            ${{ needs.version.outputs.app }}/dist/*.blockmap

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write  # store it on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      # electron-updater reads one latest-mac.yml and picks the file for the Mac's CPU from its
      # `files` (urls containing arm64 are for Apple silicon), so the Intel build's entries are
      # appended to the Apple silicon file. The format is electron-builder's fixed layout.
      - name: Merge the Mac update files
        run: |
          if [ ! -f out/latest-mac-x64.yml ]; then echo "no Intel Mac build"; exit 0; fi
          node - out/latest-mac.yml out/latest-mac-x64.yml <<'EOF'
          const { readFileSync, writeFileSync } = require('node:fs')
          const [armPath, x64Path] = process.argv.slice(2)
          const read = (path) => {
            const lines = readFileSync(path, 'utf8').replaceAll('\r\n', '\n').split('\n')
            const start = lines.indexOf('files:')
            if (start < 0) throw new Error(`${path} has no files list`)
            let end = start + 1
            while (end < lines.length && lines[end].startsWith('  ')) end++
            return { lines, start, end }
          }
          const arm = read(armPath)
          const x64 = read(x64Path)
          if (arm.lines[0] !== x64.lines[0]) throw new Error('the two Mac builds have different versions')
          const intel = x64.lines.slice(x64.start + 1, x64.end)
          if (intel.some((line) => line.includes('arm64'))) throw new Error('the Intel build named an arm64 file')
          if (!arm.lines.slice(arm.start + 1, arm.end).some((line) => line.includes('arm64'))) {
            throw new Error('the Apple silicon files are not named arm64; Intel Macs would be offered them')
          }
          const merged = [...arm.lines.slice(0, arm.end), ...intel, ...arm.lines.slice(arm.end)]
          writeFileSync(armPath, merged.join('\n'))
          EOF
          rm out/latest-mac-x64.yml
          cat out/latest-mac.yml
      - run: ls -la out

      # `gh attestation verify lyra-<v>-setup.exe --owner osbytes` proves an installer came from
      # this workflow in this repository
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.dmg
            out/*.zip
            out/*-setup.exe
            out/*.AppImage
            out/*.deb

      # SBOM of every dependency in pnpm-lock.yaml and in apps/lyra/scripts/llama/package-lock.json
      # (the node-llama-cpp tree prepare-llama.cjs ships beside the app; syft finds every lockfile
      # under the path) as SPDX JSON. It lands in out/, so the release step below attaches it with
      # the installers
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: out/lyra-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # the release body is this version's CHANGELOG.md section (what changesets wrote), not the tag message
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md && cat release-notes.md

      # only version tags publish (a tag push, or a manual run given a tag); a manual run without
      # one stops after building and attesting. The release starts as a draft and is published once
      # every file is uploaded: a published release is releases/latest at once, and the website or
      # an install reading it mid-upload would find it without its installers.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: needs.version.outputs.tag != ''
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: out/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
      - name: Publish the release
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"

      # the website caches releases/latest for an hour, across deployments; this makes its download
      # links switch now. A failure only delays them, so it warns instead of failing the release.
      - name: Refresh the website's download links
        if: needs.version.outputs.tag != ''
        env:
          SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::SITE_REVALIDATE_SECRET is not set; the website picks up this release within the hour"
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" https://lyra.osbytes.io/api/revalidate \
            || echo "::warning::the website didn't refresh; it picks up this release within the hour"
