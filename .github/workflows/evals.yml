# Speaker and transcription evals as a gate: a quick subset of the real-voice sessions
# (docs/EVALS.md), replayed through the app as a recording and compared with the stored baseline
# (apps/lyra/scripts/eval/baselines/). A change that hands words to the wrong speaker, loses
# words or relabels more of the live transcript fails here instead of sitting unread in a table.
#
# Only on PRs that touch what the evals measure: the run downloads the models and a 126 MB
# corpus (both cached) and takes several minutes on a macOS runner. The baseline is per machine
# kind (Whisper hears a little differently on each backend); this job uses the darwin-arm64 one,
# the same as an Apple-silicon Mac. To accept a change in the numbers, run
# `LYRA_SESSIONS_CORPUS=mini pnpm eval:sessions --quick --update-baseline` on such a Mac and
# commit the file with the PR, saying why in its description.
name: evals

on:
  pull_request:
    paths:
      - apps/lyra/src/main/meeting/**
      - apps/lyra/src/main/recorder.ts
      - apps/lyra/src/main/takeWriter.ts
      - apps/lyra/src/main/transcriber.ts
      - apps/lyra/src/main/speechVad.ts
      - apps/lyra/src/main/models.ts
      - apps/lyra/src/main/whisper.ts
      - apps/lyra/src/main/livePass.ts
      - apps/lyra/src/shared/sessionDoc.ts
      - apps/lyra/scripts/eval/**
      - apps/lyra/scripts/run-eval.cjs
      - apps/lyra/scripts/run-meeting-smoke.cjs
      - .github/workflows/evals.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sessions:
    name: evals (sessions, quick)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LYRA_SESSIONS_CORPUS: mini
      LYRA_MODELS_DIR: ${{ github.workspace }}/.eval-cache/models
      LYRA_EVAL_DATA: ${{ github.workspace }}/.eval-cache/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # the sessions are cut from FLAC and the remote voices go through Opus
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # the models are pinned by sha256 in the app and the sessions by DATASET_VERSION, so a
      # cache hit is the same bytes a fresh download would give
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval-cache
          key: evals-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/lyra/src/main/models.ts', 'apps/lyra/src/main/whisper.ts', 'apps/lyra/src/main/speechVad.ts', 'apps/lyra/src/main/meeting/speakers.ts', 'apps/lyra/scripts/eval/sessions.cjs', 'apps/lyra/scripts/eval/acoustics.cjs') }}
      - name: Quick session evals against the baseline
        run: pnpm --filter lyra run eval:sessions --quick --check
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: .eval-cache/data/results
          if-no-files-found: ignore
