# Security checks that complement CodeQL (default setup) and Scorecard (scorecard.yml), from the
# osbytes playbook:
#   dependencies  a PR may not add a dependency with a known moderate+ vulnerability
#   workflows     zizmor lints .github/workflows (template injection, credential persistence,
#                 dangerous triggers, …); exceptions live in .github/zizmor.yml with a reason each
#   secrets       gitleaks over the whole history (GitHub push protection only knows provider tokens)
#   word-lists    (weekly) the vendored word lists still match their pinned upstream sources
#   licenses      (weekly) every shipped dependency's licence is on the allowlist
#                 (apps/lyra/scripts/check-licenses.mjs)
# None of the jobs write anything, so they work the same on fork PRs.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # fork PRs get a read-only token; the verdict is in the job log and summary
          comment-summary-in-pr: never

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          # findings fail the job and show as annotations; no SARIF upload, so no write scope
          advanced-security: false
          annotations: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip: a secret removed in a later commit is still leaked
          persist-credentials: false
      # the gitleaks binary, pinned by release and sha256 (gitleaks-action needs a paid licence for
      # organisations). To bump: take the linux_x64 line of the release's gitleaks_<v>_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  # src/main/data/hallucinations.json and src/shared/data/whisperLanguages.json are generated from
  # sources pinned by revision and sha256; this catches a hand edit or a source that changed
  # under its pin. Needs the network, so it runs on the schedule (or by hand), not on every PR.
  word-lists:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Word lists match their sources
        working-directory: apps/lyra
        run: node scripts/update-word-lists.cjs --check

  licenses:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # only the files are needed to read their licences: no Electron download, no native builds
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter lyra...
      - name: Licences are on the allowlist
        run: |
          pnpm --filter lyra licenses list --prod --json > "$RUNNER_TEMP/licenses.json"
          node apps/lyra/scripts/check-licenses.mjs "$RUNNER_TEMP/licenses.json"
