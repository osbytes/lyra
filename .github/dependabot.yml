# Dependabot, security first (osbytes playbook). Version bumps of npm packages are off: the app
# pins what it needs and bumps on purpose (pnpm update, a changeset, an eval run). Security updates
# stay on and arrive as one grouped PR instead of one per advisory; dependabot-changeset.yml adds
# the changeset CI requires. Actions get a monthly grouped bump, because SHA pins go stale and
# carry no behavioural risk. Version bumps wait 7 days after a release (cooldown), so a hijacked
# release is usually pulled before Dependabot proposes it; security updates skip the cooldown.
version: 2
updates:
  # the pnpm workspace (apps/lyra and apps/website share the root lockfile).
  # open-pull-requests-limit: 0 switches version updates off while keeping this entry's settings
  # in force for security updates
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # the node-llama-cpp tree packaged beside the app (apps/lyra/scripts/prepare-llama.cjs), pinned
  # by its own npm lockfile outside the pnpm workspace; security updates only, like the workspace
  - package-ecosystem: npm
    directory: /apps/lyra/scripts/llama
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # actions are pinned by commit SHA with a version comment; one grouped PR a month keeps them current
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # a new major of an action renames inputs (changesets/action v2 did); bump by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
