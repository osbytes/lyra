appId: com.voicepages.app
productName: Lyra
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!native/**'
  - '!docs/**'
asarUnpack:
  - '**/*.node'
  - '**/*.dylib'
  - '**/*.dll'
  - '**/*.so'
  - '**/*.so.*'
  - node_modules/@kutalia/whisper-node-addon/**
  - node_modules/sherpa-onnx-*/**
# node-llama-cpp ships as its own npm install (see scripts/prepare-llama.cjs).
extraResources:
  - from: build/llama/node_modules
    to: llama/node_modules
win:
  icon: build/icon.png
  executableName: Lyra
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  extraResources:
    - from: build/helpers/micwatch
      to: micwatch
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Lyra records audio so it can transcribe your pages on this device.
    NSDocumentsFolderUsageDescription: Lyra saves your notes as files in the folder you choose.
    NSAudioCaptureUsageDescription: Lyra records the other side of your calls when you start a meeting.
  notarize: false
  target:
    - dmg
    - zip
dmg:
  # The arch is in the name: Apple silicon and Intel builds are published side by side.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: Lyra contributors
  category: Office
  synopsis: Local voice notebook
appImage:
  artifactName: ${name}-${version}.${ext}
# Flipped in the packaged binary only; `pnpm dev`, the smoke tests and evals run the stock
# Electron from node_modules. Workers use utilityProcess.fork, which needs neither
# ELECTRON_RUN_AS_NODE nor NODE_OPTIONS.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Only where the app's entry is found (app.asar, not a loose app/ folder); the native addons
  # in app.asar.unpacked and node-llama-cpp in resources/llama still load by path.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Left on: the renderer is served from file://, and its `type="module"` scripts (crossorigin)
  # load over file:// only with these privileges. Turn it off after moving to a custom protocol.
  grantFileProtocolExtraPrivileges: true
  # Flipping fuses breaks the binary's ad-hoc signature on Apple Silicon; builds without a
  # signing identity would not launch. A real signature, when there is one, replaces it.
  resetAdHocDarwinSignature: true
publish:
  provider: github
  owner: osbytes
  repo: lyra
npmRebuild: true
